services:
  - type: web
    name: silingscan-api
    runtime: node
    plan: free
    rootDir: SilingScan-Backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://cedriclancepablo-coder.github.io
